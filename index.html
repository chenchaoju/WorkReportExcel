<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>纯前端 Excel 报工文案生成器</title>
  <!-- SheetJS via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- html2canvas for screenshot -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #dbeafe;
      --bg: #f5f7fa;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --success: #059669;
      --warn: #d97706;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }
    header.app-header {
      margin-bottom: 20px;
    }
    header.app-header h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
    }
    header.app-header p.subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .status-bar {
      margin: 12px 0 18px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      min-height: 20px;
      line-height: 1.5;
    }
    .status-bar.success { color: var(--success); border-color: #a7f3d0; background: #ecfdf5; }
    .status-bar.warn    { color: var(--warn);    border-color: #fde68a; background: #fffbeb; }
    .status-bar.danger  { color: var(--danger);  border-color: #fecaca; background: #fef2f2; }

    .card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .card h2 .hint {
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
      margin-left: 8px;
    }
    .card h2 .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex: none;
    }

    /* Upload */
    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 28px;
      text-align: center;
      background: #fafbfc;
      transition: background .15s, border-color .15s;
      cursor: pointer;
    }
    .upload-area:hover { border-color: var(--primary); }
    .upload-area.dragover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }
    .upload-area p { margin: 6px 0; color: var(--muted); font-size: 13px; }
    .upload-area .primary-text { color: var(--text); font-size: 15px; font-weight: 500; }
    .upload-area input[type="file"] { display: none; }
    .btn {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }
    .btn:hover { background: #f3f4f6; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    .btn-primary:disabled,
    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    .btn-ghost { background: transparent; }

    /* Filter */
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-start;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 200px;
    }
    .filter-group label {
      font-size: 13px;
      color: var(--muted);
    }
    select[multiple] {
      width: 100%;
      min-height: 110px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 14px;
      color: var(--text);
    }
    select[multiple]:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
    .filter-buttons {
      display: flex;
      gap: 8px;
      margin-top: 22px;
      flex-wrap: wrap;
    }
    .filter-buttons .btn { padding: 6px 12px; font-size: 13px; }

    /* Type select */
    .type-tabs {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .type-tabs button {
      padding: 8px 14px;
      border: 0;
      background: transparent;
      font-size: 14px;
      cursor: pointer;
      color: var(--muted);
      border-right: 1px solid var(--border);
    }
    .type-tabs button:last-child { border-right: 0; }
    .type-tabs button.active {
      background: var(--primary);
      color: #fff;
    }

    /* Config card */
    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }
    .config-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .config-item label {
      font-size: 13px;
      color: var(--muted);
    }
    .config-item input[type="text"],
    .config-item input[type="number"] {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
      width: 100%;
    }
    .config-item input:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
    .config-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .config-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .config-row span { color: var(--text); }
    .config-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Column settings popup */
    .col-settings {
      position: relative;
      display: inline-block;
    }
    .col-settings-panel {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      min-width: 240px;
      box-shadow: 0 10px 25px rgba(0,0,0,.1);
      z-index: 100;
      display: none;
    }
    .col-settings-panel.open { display: block; }
    .col-settings-panel h3 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .col-list {
      list-style: none;
      padding: 0;
      margin: 0 0 10px;
      max-height: 300px;
      overflow-y: auto;
    }
    .col-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: move;
      user-select: none;
      font-size: 13px;
    }
    .col-list li:hover { background: #f3f4f6; }
    .col-list li.dragging { opacity: 0.5; }
    .col-list li.drag-over { background: var(--primary-soft); }
    .col-list li .drag-handle {
      color: var(--muted);
      cursor: move;
      font-size: 14px;
    }
    .col-list li input[type="checkbox"] {
      cursor: pointer;
      width: 15px;
      height: 15px;
    }
    .col-list li .col-name {
      flex: 1;
    }
    .col-settings-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    /* Table */
    .table-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 420px;
      overflow-y: auto;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 720px;
    }
    table.data-table th,
    table.data-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }
    table.data-table th {
      background: #f9fafb;
      position: sticky;
      top: 0;
      z-index: 1;
      font-weight: 600;
      color: #374151;
    }
    table.data-table tbody tr:nth-child(odd) { background: #fafbfc; }
    table.data-table tbody tr:hover { background: var(--primary-soft); }
    .table-meta {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    /* Text area */
    .text-wrap {
      position: relative;
    }
    .text-wrap textarea {
      width: 100%;
      min-height: 130px;
      padding: 12px 14px;
      padding-bottom: 48px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      background: #fff;
      resize: vertical;
      font-family: inherit;
    }
    .text-wrap textarea:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
    .copy-btn-wrap {
      position: absolute;
      right: 8px;
      bottom: 8px;
    }

    .row { display: flex; flex-wrap: wrap; gap: 16px; }
    .row > * { flex: 1 1 220px; }

    @media (max-width: 640px) {
      .container { padding: 16px 12px 40px; }
      header.app-header h1 { font-size: 20px; }
      .card { padding: 14px; }
      .upload-area { padding: 22px 14px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>纯前端 Excel 报工文案生成器</h1>
      <p class="subtitle">上传 Excel · 筛选直属领导 · 一键生成可复制的报工/提醒文案</p>
    </header>

    <div id="statusBar" class="status-bar">请先上传一份 Excel 文件（.xlsx / .xls）。</div>

    <!-- Upload -->
    <section class="card">
      <h2>1. 上传 Excel <span class="hint">支持 .xlsx / .xls，拖拽或点击均可</span></h2>
      <label for="fileInput" id="uploadArea" class="upload-area">
        <p class="primary-text">点击选择文件，或将 Excel 拖到此处</p>
        <p>仅解析本地文件，不会上传到任何服务器</p>
        <input id="fileInput" type="file" accept=".xlsx,.xls" />
      </label>
    </section>

    <!-- Config -->
    <section class="card" id="configCard" style="display:none;">
      <h2>2. 配置 <span class="hint">自动保存到本地浏览器，下次打开自动加载</span></h2>
      <div class="config-grid">
        <div class="config-item">
          <label for="deptNameInput">部门名称（用于文案前缀）</label>
          <input id="deptNameInput" type="text" placeholder="如：四组" value="四组" />
          <div class="config-hint">例：你好，这是<strong>四组</strong>七月份报工情况：...</div>
        </div>
        <div class="config-item">
          <label>
            <div class="config-row">
              <input type="checkbox" id="enableStaleFilter" />
              <span>启用「最近打卡时间超 X 天」过滤</span>
            </div>
          </label>
          <div style="display:flex; align-items:center; gap:8px;">
            <input id="staleDaysInput" type="number" min="1" max="365" value="15" style="width:80px; padding:6px 10px; border:1px solid var(--border); border-radius:8px;" />
            <span style="font-size:13px; color:var(--muted);">天，超过则隐藏该人员</span>
          </div>
          <div class="config-hint">对比「最近打卡时间」与「查询日期」，超过阈值的人员不参与文案生成</div>
        </div>
      </div>
    </section>

    <!-- Filter -->
    <section class="card" id="filterCard" style="display:none;">
      <h2>3. 筛选 &amp; 生成类型</h2>
      <div class="filter-row">
        <div class="filter-group" style="flex: 1 1 320px;">
          <label for="leaderSelect">直属领导（按住 Ctrl/Cmd 多选，默认全选）</label>
          <select id="leaderSelect" multiple></select>
          <div class="filter-buttons">
            <button class="btn" id="selectAllBtn" type="button">全选</button>
            <button class="btn" id="clearAllBtn" type="button">清空</button>
          </div>
        </div>
        <div class="filter-group" style="min-width: 240px;">
          <label>生成类型</label>
          <div class="type-tabs" id="typeTabs" role="tablist">
            <button type="button" data-type="monthly" class="active">当月报工情况</button>
            <button type="button" data-type="today">今日未报工提醒</button>
          </div>
          <div class="table-meta" id="dateHint" style="margin-top:8px;"></div>
        </div>
      </div>
    </section>

    <!-- Table -->
    <section class="card" id="tableCard" style="display:none;">
      <div class="table-header-bar">
        <h2 style="margin:0;">4. 数据预览 <span class="hint" id="rowCountHint"></span></h2>
        <div class="col-settings">
          <button class="btn btn-sm" id="colSettingsBtn" type="button">列设置</button>
          <div class="col-settings-panel" id="colSettingsPanel">
            <h3>显示/隐藏 &amp; 拖拽排序列</h3>
            <ul class="col-list" id="colList"></ul>
            <div class="col-settings-actions">
              <button class="btn btn-sm" id="resetColsBtn" type="button">恢复默认</button>
              <button class="btn btn-sm btn-primary" id="closeColsBtn" type="button">完成</button>
            </div>
          </div>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table" id="dataTable">
          <thead>
            <tr id="tableHeadRow"></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- Text output -->
    <section class="card" id="outputCard" style="display:none;">
      <h2>5. 生成文案 <span class="hint" id="outputHint"></span></h2>
      <div class="text-wrap">
        <textarea id="outputText" readonly placeholder="筛选数据后此处会显示生成的文案"></textarea>
        <div class="copy-btn-wrap">
          <button class="btn" id="screenshotBtn" type="button" disabled>复制截图</button>
          <button class="btn btn-primary" id="copyBtn" type="button" disabled>一键复制</button>
        </div>
      </div>
    </section>
  </div>

  <script>
  (function () {
    'use strict';

    // ===== Constants =====
    var STORAGE_KEY = 'workReportExcelConfig_v1';
    var NAME_FIELD_ALIASES = ['本人/本部门', '姓名/本部门'];
    var REQUIRED_FIELDS = [
      '本人/本部门',
      '直属领导',
      '当月报工(件数)',
      '当天报工(件数)',
      '查询日期'
    ];
    var DEFAULT_COLUMNS = [
      { key: '序号', label: '序号', visible: true, required: true },
      { key: '本人/本部门', label: '本人/本部门', visible: true, required: true },
      { key: '直属领导', label: '直属领导', visible: true, required: true },
      { key: '当月报工(件数)', label: '当月报工(件数)', visible: true, required: false },
      { key: '当天报工(件数)', label: '当天报工(件数)', visible: true, required: false },
      { key: '查询日期', label: '查询日期', visible: true, required: false },
      { key: '最近打卡时间', label: '最近打卡时间', visible: false, required: false }
    ];

    // ===== State =====
    var state = {
      rawRows: [],
      displayRows: [],
      leaders: [],
      selectedLeaders: [],
      type: 'monthly',
      columns: JSON.parse(JSON.stringify(DEFAULT_COLUMNS)),
      config: {
        deptName: '四组',
        enableStaleFilter: false,
        staleDays: 15
      }
    };

    // ===== DOM =====
    var elFileInput   = document.getElementById('fileInput');
    var elUploadArea  = document.getElementById('uploadArea');
    var elStatusBar   = document.getElementById('statusBar');
    var elConfigCard  = document.getElementById('configCard');
    var elFilterCard  = document.getElementById('filterCard');
    var elTableCard   = document.getElementById('tableCard');
    var elOutputCard  = document.getElementById('outputCard');
    var elLeaderSel   = document.getElementById('leaderSelect');
    var elSelectAll   = document.getElementById('selectAllBtn');
    var elClearAll    = document.getElementById('clearAllBtn');
    var elTypeTabs    = document.getElementById('typeTabs');
    var elDateHint    = document.getElementById('dateHint');
    var elDataTable   = document.getElementById('dataTable');
    var elTbody       = elDataTable.querySelector('tbody');
    var elTheadRow    = document.getElementById('tableHeadRow');
    var elRowCount    = document.getElementById('rowCountHint');
    var elOutputText  = document.getElementById('outputText');
    var elCopyBtn     = document.getElementById('copyBtn');
    var elScreenshotBtn = document.getElementById('screenshotBtn');
    var elOutputHint  = document.getElementById('outputHint');
    var elDeptName    = document.getElementById('deptNameInput');
    var elStaleEnable = document.getElementById('enableStaleFilter');
    var elStaleDays   = document.getElementById('staleDaysInput');
    var elColSettingsBtn = document.getElementById('colSettingsBtn');
    var elColSettingsPanel = document.getElementById('colSettingsPanel');
    var elColList = document.getElementById('colList');
    var elResetColsBtn = document.getElementById('resetColsBtn');
    var elCloseColsBtn = document.getElementById('closeColsBtn');

    // ===== Storage =====
    function loadConfig() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        var obj = JSON.parse(raw);
        if (obj.config && typeof obj.config === 'object') {
          if (typeof obj.config.deptName === 'string') state.config.deptName = obj.config.deptName;
          if (typeof obj.config.enableStaleFilter === 'boolean') state.config.enableStaleFilter = obj.config.enableStaleFilter;
          if (typeof obj.config.staleDays === 'number') state.config.staleDays = obj.config.staleDays;
        }
        if (Array.isArray(obj.columns)) {
          var newCols = [];
          obj.columns.forEach(function (c) {
            var existing = state.columns.find(function (d) { return d.key === c.key; });
            if (existing) {
              newCols.push({
                key: existing.key,
                label: existing.label,
                visible: typeof c.visible === 'boolean' ? c.visible : existing.visible,
                required: existing.required
              });
            }
          });
          if (newCols.length) {
            DEFAULT_COLUMNS.forEach(function (c) {
              if (!newCols.find(function (n) { return n.key === c.key; })) {
                newCols.push(JSON.parse(JSON.stringify(c)));
              }
            });
            state.columns = newCols;
          }
        }
      } catch (e) { /* ignore */ }
    }

    function saveConfig() {
      try {
        var data = {
          config: state.config,
          columns: state.columns.map(function (c) {
            return { key: c.key, visible: c.visible };
          })
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) { /* ignore */ }
    }

    function syncConfigUI() {
      elDeptName.value = state.config.deptName;
      elStaleEnable.checked = state.config.enableStaleFilter;
      elStaleDays.value = state.config.staleDays;
      elStaleDays.disabled = !state.config.enableStaleFilter;
    }

    // ===== Utilities =====
    function setStatus(msg, level) {
      elStatusBar.textContent = msg || '';
      elStatusBar.className = 'status-bar' + (level ? ' ' + level : '');
    }

    function safeText(v) {
      if (v === null || v === undefined) return '';
      return String(v).trim();
    }

    function toNumber(v) {
      if (v === null || v === undefined || v === '') return 0;
      var n = Number(v);
      if (isNaN(n)) return 0;
      return n;
    }

    function parseDate(str) {
      if (!str) return null;
      var s = String(str).trim();
      var m = s.match(/^(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})/);
      if (m) {
        var y = parseInt(m[1], 10);
        var mo = parseInt(m[2], 10);
        var d = parseInt(m[3], 10);
        if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) {
          return { year: y, month: mo, day: d, raw: s, ts: new Date(y, mo - 1, d).getTime() };
        }
      }
      var n = Number(s);
      if (!isNaN(n) && n > 25569) {
        var ms = (n - 25569) * 86400 * 1000;
        var dt = new Date(ms);
        if (!isNaN(dt.getTime())) {
          return {
            year: dt.getUTCFullYear(),
            month: dt.getUTCMonth() + 1,
            day: dt.getUTCDate(),
            raw: s,
            ts: dt.getTime()
          };
        }
      }
      var dt2 = new Date(s);
      if (!isNaN(dt2.getTime())) {
        return {
          year: dt2.getFullYear(),
          month: dt2.getMonth() + 1,
          day: dt2.getDate(),
          raw: s,
          ts: dt2.getTime()
        };
      }
      return null;
    }

    function getFirstDate() {
      for (var i = 0; i < state.displayRows.length; i++) {
        var d = parseDate(state.displayRows[i]['查询日期']);
        if (d) return d;
      }
      return null;
    }

    function isStale(row) {
      if (!state.config.enableStaleFilter) return false;
      var queryD = parseDate(row['查询日期']);
      var punchD = parseDate(row['最近打卡时间']);
      if (!queryD || !punchD) return false;
      var diffDays = (queryD.ts - punchD.ts) / (1000 * 60 * 60 * 24);
      return diffDays > state.config.staleDays;
    }

    // ===== Excel parsing =====
    function handleFile(file) {
      if (!file) return;
      var name = (file.name || '').toLowerCase();
      if (!/\.(xlsx|xls)$/.test(name)) {
        setStatus('请上传 Excel 文件 (.xlsx / .xls)', 'danger');
        return;
      }
      setStatus('正在解析 ' + file.name + ' …', 'warn');
      var reader = new FileReader();
      reader.onload = function (e) {
        try {
          var data = new Uint8Array(e.target.result);
          var workbook = XLSX.read(data, { type: 'array', cellDates: false });
          var firstSheet = workbook.SheetNames[0];
          if (!firstSheet) {
            setStatus('Excel 中没有可读取的工作表', 'danger');
            return;
          }
          var sheet = workbook.Sheets[firstSheet];
          var rows = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: true });
          if (!rows.length) {
            setStatus('Excel 中没有数据行', 'warn');
            return;
          }
          var sample = rows[0];
          var headers = Object.keys(sample);
          var nameField = NAME_FIELD_ALIASES.find(function (alias) { return headers.indexOf(alias) !== -1; });
          if (!nameField) {
            setStatus('Excel 缺少「姓名/本部门」或「本人/本部门」列。请检查表头后重新上传。', 'danger');
            return;
          }
          var otherRequired = REQUIRED_FIELDS.slice(1);
          var missing = otherRequired.filter(function (h) { return headers.indexOf(h) === -1; });
          if (missing.length) {
            setStatus('Excel 缺少必要列：' + missing.join('、') + '。请检查表头后重新上传。', 'danger');
            return;
          }
          var cleaned = rows.map(function (r) {
            var obj = {};
            obj['本人/本部门'] = (r[nameField] === undefined || r[nameField] === null) ? '' : r[nameField];
            state.columns.forEach(function (col) {
              if (col.key === '本人/本部门' || col.key === '序号') return;
              var v = r[col.key];
              obj[col.key] = (v === undefined || v === null) ? '' : v;
            });
            state.columns.forEach(function (col) {
              if (col.key === '本人/本部门' || col.key === '序号' || obj.hasOwnProperty(col.key)) return;
              var v = r[col.key];
              obj[col.key] = (v === undefined || v === null) ? '' : v;
            });
            return obj;
          });
          state.rawRows = cleaned;
          initLeaders(cleaned);
          setStatus('解析成功：共 ' + cleaned.length + ' 行数据，请选择直属领导并切换生成类型。', 'success');
          elConfigCard.style.display = '';
          elFilterCard.style.display = '';
          elTableCard.style.display = '';
          elOutputCard.style.display = '';
          renderLeaderOptions();
          applyFilter();
        } catch (err) {
          console.error(err);
          setStatus('解析失败：' + (err && err.message ? err.message : err), 'danger');
        }
      };
      reader.onerror = function () {
        setStatus('读取文件失败，请重试', 'danger');
      };
      reader.readAsArrayBuffer(file);
    }

    function initLeaders(rows) {
      var set = {};
      rows.forEach(function (r) {
        var l = safeText(r['直属领导']);
        if (l) set[l] = true;
      });
      var list = Object.keys(set).sort(function (a, b) { return a.localeCompare(b, 'zh-Hans-CN'); });
      state.leaders = list;
      state.selectedLeaders = list.slice();
    }

    function renderLeaderOptions() {
      elLeaderSel.innerHTML = '';
      state.leaders.forEach(function (l) {
        var opt = document.createElement('option');
        opt.value = l;
        opt.textContent = l;
        if (state.selectedLeaders.indexOf(l) !== -1) opt.selected = true;
        elLeaderSel.appendChild(opt);
      });
    }

    function getSelectedLeaders() {
      var arr = [];
      for (var i = 0; i < elLeaderSel.options.length; i++) {
        var o = elLeaderSel.options[i];
        if (o.selected) arr.push(o.value);
      }
      return arr;
    }

    function applyFilter() {
      var sel = getSelectedLeaders();
      state.selectedLeaders = sel;
      var filtered = state.rawRows.filter(function (r) {
        var l = safeText(r['直属领导']);
        return sel.indexOf(l) !== -1;
      });
      if (state.config.enableStaleFilter) {
        filtered = filtered.filter(function (r) { return !isStale(r); });
      }
      state.displayRows = filtered;
      renderTable();
      generateOutput();
    }

    // ===== Table rendering =====
    function renderTable() {
      elTheadRow.innerHTML = '';
      var visibleCols = state.columns.filter(function (c) { return c.visible; });
      visibleCols.forEach(function (col) {
        var th = document.createElement('th');
        th.textContent = col.label;
        elTheadRow.appendChild(th);
      });

      elTbody.innerHTML = '';
      var frag = document.createDocumentFragment();
      state.displayRows.forEach(function (r, i) {
        var tr = document.createElement('tr');
        visibleCols.forEach(function (col) {
          var td = document.createElement('td');
          if (col.key === '序号') {
            td.textContent = String(i + 1);
          } else {
            var v = r[col.key];
            td.textContent = (v === undefined || v === null) ? '' : safeText(v);
          }
          tr.appendChild(td);
        });
        frag.appendChild(tr);
      });
      elTbody.appendChild(frag);

      var staleCount = state.config.enableStaleFilter
        ? (state.rawRows.filter(function (r) { return isStale(r); }).length)
        : 0;
      var totalFiltered = state.displayRows.length;
      var countText = '共 ' + totalFiltered + ' / ' + state.rawRows.length + ' 行';
      if (staleCount > 0) countText += '（已过滤 ' + staleCount + ' 条超 ' + state.config.staleDays + ' 天未打卡人员）';
      elRowCount.textContent = countText;
    }

    // ===== Column settings =====
    function renderColList() {
      elColList.innerHTML = '';
      state.columns.forEach(function (col, idx) {
        var li = document.createElement('li');
        li.draggable = !col.required ? true : true;
        li.dataset.key = col.key;
        li.dataset.index = String(idx);

        var handle = document.createElement('span');
        handle.className = 'drag-handle';
        handle.textContent = '☰';
        li.appendChild(handle);

        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = col.visible;
        cb.disabled = !!col.required;
        cb.dataset.key = col.key;
        li.appendChild(cb);

        var name = document.createElement('span');
        name.className = 'col-name';
        name.textContent = col.label + (col.required ? '（必显）' : '');
        li.appendChild(name);

        li.addEventListener('dragstart', function (e) {
          li.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', col.key);
        });
        li.addEventListener('dragend', function () {
          li.classList.remove('dragging');
          var items = elColList.querySelectorAll('li');
          items.forEach(function (it) { it.classList.remove('drag-over'); });
        });
        li.addEventListener('dragover', function (e) {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          li.classList.add('drag-over');
        });
        li.addEventListener('dragleave', function () {
          li.classList.remove('drag-over');
        });
        li.addEventListener('drop', function (e) {
          e.preventDefault();
          li.classList.remove('drag-over');
          var draggedKey = e.dataTransfer.getData('text/plain');
          var targetKey = col.key;
          if (draggedKey === targetKey) return;
          var fromIdx = state.columns.findIndex(function (c) { return c.key === draggedKey; });
          var toIdx = state.columns.findIndex(function (c) { return c.key === targetKey; });
          if (fromIdx === -1 || toIdx === -1) return;
          var moved = state.columns.splice(fromIdx, 1)[0];
          state.columns.splice(toIdx, 0, moved);
          saveConfig();
          renderColList();
          renderTable();
        });

        cb.addEventListener('change', function () {
          var found = state.columns.find(function (c) { return c.key === col.key; });
          if (found && !found.required) {
            found.visible = cb.checked;
            saveConfig();
            renderTable();
          }
        });

        elColList.appendChild(li);
      });
    }

    // ===== Output generation =====
    function generateOutput() {
      elOutputHint.textContent = '';
      if (!state.displayRows.length) {
        elOutputText.value = '';
        elCopyBtn.disabled = true;
        elScreenshotBtn.disabled = true;
        elOutputHint.textContent = '当前筛选下没有数据。';
        updateDateHint();
        return;
      }

      if (state.type === 'monthly') {
        var monthly = buildMonthlyText();
        elOutputText.value = monthly.text;
        elCopyBtn.disabled = !monthly.text;
        elScreenshotBtn.disabled = false;
        elOutputHint.textContent = monthly.hint || '';
      } else {
        var today = buildTodayText();
        elOutputText.value = today.text;
        elCopyBtn.disabled = !today.text;
        elScreenshotBtn.disabled = false;
        elOutputHint.textContent = today.hint || '';
      }
      updateDateHint();
    }

    function buildMonthlyText() {
      var date = getFirstDate();
      var monthLabel;
      if (date) {
        monthLabel = date.month + '月份';
      } else {
        var now = new Date();
        monthLabel = (now.getMonth() + 1) + '月份';
      }
      var dept = safeText(state.config.deptName) || '四组';
      var rows = state.displayRows;
      var zeroList = [];
      var reportList = [];
      rows.forEach(function (r) {
        var name = safeText(r['本人/本部门']);
        if (!name) return;
        var n = toNumber(r['当月报工(件数)']);
        if (n === 0) {
          zeroList.push(name);
        } else {
          reportList.push(name + '已报工' + n + '次');
        }
      });
      var prefix = '你好，这是' + dept + monthLabel + '报工情况：';
      var body = '';
      if (zeroList.length === 0) {
        body = reportList.join(', ') + '。';
      } else if (reportList.length === 0) {
        body = zeroList.join('、') + '当月未报工，麻烦提醒一下。';
      } else {
        body = zeroList.join('、') + '当月未报工，麻烦提醒一下; ' + reportList.join(', ') + '。';
      }
      var text = prefix + body;
      return { text: text, hint: '已生成「' + dept + '」' + monthLabel + '报工情况' };
    }

    function buildTodayText() {
      var date = getFirstDate();
      var dateLabel;
      if (date) {
        dateLabel = date.month + '月' + date.day + '日';
      } else {
        var now = new Date();
        dateLabel = (now.getMonth() + 1) + '月' + now.getDate() + '日';
      }
      var dept = safeText(state.config.deptName) || '四组';
      var rows = state.displayRows;
      var zeroList = [];
      rows.forEach(function (r) {
        var n = toNumber(r['当天报工(件数)']);
        var name = safeText(r['本人/本部门']);
        if (!name) return;
        if (n === 0) zeroList.push(name);
      });
      if (zeroList.length === 0) {
        return {
          text: '',
          hint: '当前筛选下无人今日未报工'
        };
      }
      var prefix = '你好，这是' + dept + dateLabel + '报工情况：';
      var text = prefix + zeroList.join('、') + '今日未报工，麻烦提醒一下。';
      return { text: text, hint: '已生成「' + dept + '」' + dateLabel + '未报工提醒' };
    }

    function updateDateHint() {
      var d = getFirstDate();
      if (d) {
        elDateHint.textContent = '已从「查询日期」解析：' + d.year + '年' + d.month + '月' + d.day + '日';
      } else {
        elDateHint.textContent = '未能从「查询日期」解析到有效日期，将使用当前日期/月份。';
      }
    }

    // ===== Copy =====
    function copyText(text) {
      return new Promise(function (resolve) {
        var done = function (ok) { resolve(ok); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { done(true); }, function () {
            done(fallbackCopy(text));
          });
        } else {
          done(fallbackCopy(text));
        }
      });
    }

    function fallbackCopy(text) {
      try {
        elOutputText.removeAttribute('readonly');
        elOutputText.focus();
        elOutputText.select();
        elOutputText.setSelectionRange(0, text.length);
        var ok = document.execCommand('copy');
        elOutputText.setAttribute('readonly', '');
        window.getSelection && window.getSelection().removeAllRanges();
        return !!ok;
      } catch (e) {
        return false;
      }
    }

    function flashCopyButton(ok) {
      elCopyBtn.textContent = ok ? '已复制' : '复制失败，请手动复制';
      elCopyBtn.disabled = !ok ? false : true;
      setTimeout(function () {
        elCopyBtn.textContent = '一键复制';
        elCopyBtn.disabled = !elOutputText.value;
      }, 2000);
    }

    // ===== Screenshot =====
    function screenshotAndCopy() {
      if (!state.displayRows.length) return;
      setStatus('正在生成截图…', 'warn');
      var target = document.getElementById('tableCard');
      if (!target) return;
      html2canvas(target, {
        backgroundColor: '#ffffff',
        scale: 2,
        useCORS: true
      }).then(function (canvas) {
        canvas.toBlob(function (blob) {
          if (!blob) {
            setStatus('截图生成失败', 'danger');
            return;
          }
          try {
            if (navigator.clipboard && navigator.clipboard.write) {
              var item = new ClipboardItem({ 'image/png': blob });
              navigator.clipboard.write([item]).then(function () {
                setStatus('截图已复制到剪贴板', 'success');
                elScreenshotBtn.textContent = '已复制';
                setTimeout(function () {
                  elScreenshotBtn.textContent = '复制截图';
                }, 2000);
              }, function () {
                fallbackDownload(blob);
              });
            } else {
              fallbackDownload(blob);
            }
          } catch (e) {
            fallbackDownload(blob);
          }
        }, 'image/png');
      }).catch(function (err) {
        console.error(err);
        setStatus('截图失败：' + (err.message || err), 'danger');
      });
    }

    function fallbackDownload(blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '报工数据截图_' + new Date().toISOString().slice(0,10) + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus('截图已下载（浏览器不支持直接复制图片到剪贴板）', 'warn');
    }

    // ===== Event binding =====
    elFileInput.addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (f) handleFile(f);
    });

    ['dragenter', 'dragover'].forEach(function (evt) {
      elUploadArea.addEventListener(evt, function (e) {
        e.preventDefault();
        e.stopPropagation();
        elUploadArea.classList.add('dragover');
      });
    });
    ['dragleave', 'drop'].forEach(function (evt) {
      elUploadArea.addEventListener(evt, function (e) {
        e.preventDefault();
        e.stopPropagation();
        elUploadArea.classList.remove('dragover');
      });
    });
    elUploadArea.addEventListener('drop', function (e) {
      var dt = e.dataTransfer;
      if (dt && dt.files && dt.files[0]) handleFile(dt.files[0]);
    });

    elLeaderSel.addEventListener('change', function () {
      applyFilter();
    });

    elSelectAll.addEventListener('click', function () {
      for (var i = 0; i < elLeaderSel.options.length; i++) {
        elLeaderSel.options[i].selected = true;
      }
      applyFilter();
    });

    elClearAll.addEventListener('click', function () {
      for (var i = 0; i < elLeaderSel.options.length; i++) {
        elLeaderSel.options[i].selected = false;
      }
      applyFilter();
    });

    elTypeTabs.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-type]');
      if (!btn) return;
      var btns = elTypeTabs.querySelectorAll('button');
      btns.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      state.type = btn.getAttribute('data-type');
      generateOutput();
    });

    elCopyBtn.addEventListener('click', function () {
      var text = elOutputText.value;
      if (!text) return;
      copyText(text).then(function (ok) {
        flashCopyButton(ok);
        if (!ok) {
          setStatus('复制失败，请手动选中并复制文案', 'warn');
        } else {
          setStatus('已复制到剪贴板', 'success');
        }
      });
    });

    elScreenshotBtn.addEventListener('click', function () {
      screenshotAndCopy();
    });

    // Config events
    elDeptName.addEventListener('input', function () {
      state.config.deptName = elDeptName.value;
      saveConfig();
      generateOutput();
    });
    elStaleEnable.addEventListener('change', function () {
      state.config.enableStaleFilter = elStaleEnable.checked;
      elStaleDays.disabled = !state.config.enableStaleFilter;
      saveConfig();
      if (state.rawRows.length) applyFilter();
    });
    elStaleDays.addEventListener('input', function () {
      var n = parseInt(elStaleDays.value, 10);
      if (isNaN(n) || n < 1) n = 15;
      state.config.staleDays = n;
      saveConfig();
      if (state.rawRows.length && state.config.enableStaleFilter) applyFilter();
    });

    // Column settings events
    elColSettingsBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      renderColList();
      elColSettingsPanel.classList.toggle('open');
    });
    elCloseColsBtn.addEventListener('click', function () {
      elColSettingsPanel.classList.remove('open');
    });
    elResetColsBtn.addEventListener('click', function () {
      state.columns = JSON.parse(JSON.stringify(DEFAULT_COLUMNS));
      saveConfig();
      renderColList();
      renderTable();
    });
    document.addEventListener('click', function (e) {
      if (!elColSettingsPanel.classList.contains('open')) return;
      if (elColSettingsPanel.contains(e.target) || e.target === elColSettingsBtn) return;
      elColSettingsPanel.classList.remove('open');
    });

    // ===== Init =====
    loadConfig();
    syncConfigUI();
  })();
  </script>
</body>
</html>
